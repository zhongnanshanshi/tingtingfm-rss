<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>照亮新闻深处 · Podcast RSS</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.7 -apple-system, "PingFang SC", sans-serif; max-width: 620px;
         margin: 8vh auto; padding: 0 20px; }
  h1 { font-size: 1.4rem; margin-bottom: .2em; }
  .sub { color: #888; margin-top: 0; }
  .url { display: block; background: #f4f4f5; padding: 14px 16px; border-radius: 10px;
         font-family: ui-monospace, Menlo, monospace; font-size: .92rem;
         word-break: break-all; margin: 18px 0; }
  @media (prefers-color-scheme: dark) { .url { background: #1f1f22; } }
  a.btn { display: inline-block; margin-top: 8px; padding: 10px 18px; border-radius: 999px;
          background: #c0392b; color: #fff; text-decoration: none; }
  ol { padding-left: 1.2em; } li { margin: .4em 0; }
</style>
<h1>照亮新闻深处</h1>
<p class="sub">北京新闻广播 FM94.5 · 主播 段玉龙、张艳</p>

<p>播客订阅地址：</p>
<span class="url" id="u"></span>
<a class="btn" id="copy" href="#">复制地址</a>

<h3>怎么订阅</h3>
<ol>
  <li>复制上面的地址</li>
  <li>打开 Apple Podcasts / Overcast / Pocket Casts / 小宇宙</li>
  <li>找到「通过 URL 添加节目」，粘贴即可</li>
</ol>

<p class="sub">每周更新一期。音频版权归北京广播电视台所有，仅供个人收听。</p>

<script>
  const url = location.origin + location.pathname.replace(/\/[^/]*$/, "/") + "feed.xml";
  document.getElementById("u").textContent = url;
  document.getElementById("copy").onclick = e => {
    e.preventDefault();
    navigator.clipboard.writeText(url).then(() => {
      e.target.textContent = "已复制 ✓";
      setTimeout(() => (e.target.textContent = "复制地址"), 1600);
    });
  };
</script>
</html>
