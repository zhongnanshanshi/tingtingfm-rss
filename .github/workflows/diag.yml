name: diag

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: runner geo
        run: |
          curl -s --max-time 15 https://ipinfo.io/json || true

      - name: POST with python (same as script)
        run: |
          python3 - <<'PY'
          import hashlib, urllib.parse, urllib.request, traceback
          SECRET="1Ftjv0bfpVmqbE38"
          p={"version":"h5_6.6.3.4","client":"h5_YIidkdCDk4PMSHyqmTM4GYoALLUQCY","h_program_id":"VkZorENdE7"}
          parts=[f"{k}={urllib.parse.quote(str(v),safe='')}" for k,v in p.items()]
          p["api_sign"]=hashlib.md5(("&".join(sorted(parts))+"_"+SECRET).encode()).hexdigest()
          url="https://api-v3.tingtingfm.com/broadcast/get_program_v3_8?"+urllib.parse.urlencode(p)
          for method in ("POST","GET"):
              try:
                  req=urllib.request.Request(url, data=b"" if method=="POST" else None,
                      headers={"User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) Mobile/15E148"})
                  req.get_method=lambda m=method: m
                  r=urllib.request.urlopen(req, timeout=25)
                  print(method, r.status, r.read()[:300])
              except Exception as e:
                  print(method, "ERR", repr(e))
                  if hasattr(e,"read"):
                      print("  body:", e.read()[:400])
                      print("  headers:", dict(e.headers))
          PY

      - name: curl probes
        run: |
          U="https://api-v3.tingtingfm.com/broadcast/get_program_audio_list?version=h5_6.6.3.4&client=h5_YIidkdCDk4PMSHyqmTM4GYoALLUQCY&h_program_id=VkZorENdE7&api_sign=14c4bfa43f762de927973373b1001440"
          echo "--- GET ---"; curl -sS -D - -o /tmp/a "$U" --max-time 25 | head -20; head -c 300 /tmp/a; echo
          echo "--- site root ---"; curl -sS -o /dev/null -D - --max-time 20 "https://mobile.tingtingfm.com/" | head -12
          echo "--- api root ---"; curl -sS -o /dev/null -D - --max-time 20 "https://api-v3.tingtingfm.com/" | head -12
